name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            binary: svg-auto
          - name: Windows
            os: windows-latest
            binary: svg-auto.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build executable
        run: go build -o ${{ matrix.binary }} .

      - name: Smoke test executable (Linux)
        if: runner.os == 'Linux'
        run: ./svg-auto --help

      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        run: .\svg-auto.exe --help

  e2e:
    name: E2E (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            no_sandbox: "1"
          - name: Windows
            os: windows-latest
            no_sandbox: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run live IcoMoon end-to-end test
        env:
          SVG_AUTO_NO_SANDBOX: ${{ matrix.no_sandbox }}
        run: go test -tags=e2e -run '^TestEndToEndIcoMoon$' -v -count=1 -timeout=9m
